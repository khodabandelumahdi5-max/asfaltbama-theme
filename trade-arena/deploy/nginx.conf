# Reverse proxy for Trade Arena. Socket.io clients use the WebSocket transport only, so
# no sticky sessions are needed; any instance can serve any client (state lives in Redis).

upstream arena_api {
    least_conn;
    server 127.0.0.1:4000 max_fails=2 fail_timeout=5s;
    server 127.0.0.1:4001 max_fails=2 fail_timeout=5s;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl http2;
    server_name api.example.com;
    # ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    location /socket.io/ {
        proxy_pass http://arena_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_next_upstream error timeout http_502 http_503;
    }

    # The bot talks to /internal over loopback; never expose it publicly.
    location /internal/ { return 404; }

    location / {
        proxy_pass http://arena_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A draining instance answers 503 on readiness and new requests retry on the peer.
        proxy_next_upstream error timeout http_502 http_503;
    }
}

server {
    listen 443 ssl http2;
    server_name app.example.com;   # Telegram Mini App (must be HTTPS)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
